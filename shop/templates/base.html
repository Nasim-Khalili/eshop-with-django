<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه اینترنتی</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}"> نانا شاپ</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:product_list' %}">خانه</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:view_cart' %}">سبد خرید</a></li>
                    {% if user.is_staff %}
                    <li class="nav-item"><a class="nav-link" href="{% url 'shop:add_product' %}">افزودن محصول</a></li>
                    {% endif %}
                </ul>
                <div class="d-flex">
                    {% if user.is_authenticated %}
                        <span class="navbar-text mx-3">سلام {{ user.username }}</span>
                        <a href="{% url 'signout' %}" class="btn btn-outline-light">خروج</a>
                    {% else %}
                        <a href="{% url 'signin' %}" class="btn btn-outline-light mx-2">ورود</a>
                        <a href="{% url 'signup' %}" class="btn btn-light">ثبت نام</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
