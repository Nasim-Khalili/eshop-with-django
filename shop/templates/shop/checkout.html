{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-8">
        <h2>تکمیل خرید</h2>
        <table class="table">
            <thead>
                <tr>
                    <th>محصول</th>
                    <th>قیمت</th>
                    <th>تعداد</th>
                    <th>جمع</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr>
                    <td>{{ item.product.name }}</td>
                    <td>{{ item.product.price }} تومان</td>
                    <td>{{ item.quantity }}</td>
                    <td>{{ item.total_price }} تومان</td>
                </tr>
                {% endfor %}
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">جمع کل:</th>
                    <th>{{ total }} تومان</th>
                </tr>
            </tfoot>
        </table>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h4>جزئیات پرداخت</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">آدرس ایمیل</label>
                        <input type="email" class="form-control" value="{{ request.user.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">آدرس تحویل</label>
                        <textarea class="form-control" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">پرداخت</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
